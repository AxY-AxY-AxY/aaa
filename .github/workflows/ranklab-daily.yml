name: RankLab daily YouTube keyword measurements
on:
  push:
    branches: [main]
    paths:
      - "ranklab/collect_research.py"
      - "ranklab/generate_production_suggestions.py"
      - ".github/workflows/ranklab-daily.yml"
  schedule:
    - cron: "19 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ranklab-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect publicly available autocomplete and competitor video data
        run: python3 -u ranklab/collect_research.py
      - name: Convert ranked keywords to production proposals
        run: python3 -u ranklab/generate_production_suggestions.py
      - name: Commit source-backed measurements
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Preserve completed research while refreshing the base checkout; this prevents
          # stale checkout / non-fast-forward conflicts with dashboard edits.
          SNAP="$(mktemp -d)"
          cp ranklab/research-data.json ranklab/production-suggestions.json ranklab/seo-feed.json "$SNAP"/
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$SNAP"/research-data.json "$SNAP"/production-suggestions.json "$SNAP"/seo-feed.json ranklab/
            git add ranklab/research-data.json ranklab/production-suggestions.json ranklab/seo-feed.json
            if git diff --cached --quiet; then pushed=true; break; fi
            git commit -m "Refresh RankLab research, SEO feed and production proposals"
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "Concurrent repository update; retrying proposal-only commit: $attempt"
          done
          rm -rf "$SNAP"
          if [[ "$pushed" != true ]]; then exit 1; fi
