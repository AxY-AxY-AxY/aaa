name: Probe YouTube live data sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-ranklab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Source verification
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          tests = [
            ('suggest', 'https://suggestqueries.google.com/complete/search?client=chrome&ds=yt&hl=en&gl=US&callback=rankLabCb&q=valorant%20cheat'),
            ('suggest-json', 'https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&hl=en&gl=US&q=valorant%20cheat'),
            ('nadeko', 'https://inv.nadeko.net/api/v1/search?q=valorant%20cheat&type=video&region=US'),
            ('nerdvpn', 'https://invidious.nerdvpn.de/api/v1/search?q=valorant%20cheat&type=video&region=US'),
            ('chocolate', 'https://yt.chocolatemoo53.com/api/v1/search?q=valorant%20cheat&type=video&region=US'),
            ('tiekoetter', 'https://invidious.tiekoetter.com/api/v1/search?q=valorant%20cheat&type=video&region=US'),
            ('piped', 'https://pipedapi.kavin.rocks/search?q=valorant%20cheat&filter=videos')
          ]
          for name,url in tests:
            try:
              req = urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 RankLab probe', 'Accept':'application/json,text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=13) as resp:
                data=resp.read(30000).decode('utf-8','replace')
                typ=''; cnt=0
                try:
                  j=json.loads(data)
                  typ=type(j).__name__
                  cnt=len(j) if hasattr(j,'__len__') else 0
                except: typ=data[:36]
                print(name,resp.status,resp.headers.get('Access-Control-Allow-Origin'),len(data),typ,cnt,repr(data[:115]))
            except Exception as e:
              print(name,'ERROR',str(e)[:180])
          PY
