name: Research Google Trends YouTube signal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-trends.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - name: Probe Trends API read-only
      run: |
        python3 - <<'PY'
        import json, urllib.request, urllib.error, urllib.parse, time
        for geo,term in [('JP','フォートナイト チート'),('US','valorant cheat')]:
          req={'comparisonItem':[{'keyword':term,'geo':geo,'time':'today 12-m'}],'category':0,'property':'youtube'}
          url='https://trends.google.com/trends/api/explore?'+urllib.parse.urlencode({'hl':'ja','tz':'-540','req':json.dumps(req,ensure_ascii=False)})
          try:
            resp=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36','Accept-Language':'ja-JP,ja;q=0.8'}),timeout=12)
            out=resp.read(5000).decode('utf-8','replace');print('TRENDS',geo,resp.status,repr(out[:450]))
          except Exception as e:print('TRENDS',geo,'ERROR',str(e)[:250])
          time.sleep(1)
        PY
