name: Verify live RankLab end to end
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-ranklab-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Browser and API smoke test
        run: |
          set -e
          which google-chrome || which chromium || true
          npm install --no-save playwright-core@1.58.0
          node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1280,height:900}});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.goto('https://nebula-cord-u83m9.ship.place/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>Number(document.querySelector('#planTotal')?.textContent||0)>=230,{timeout:10000});
              console.log('CURATED KEYWORD COUNT:',await page.locator('#planTotal').innerText());
              console.log('FIRST TARGET:',await page.locator('.plan-kw').first.innerText());
              console.log('INITIAL TARGET ROWS:',await page.locator('.plan-row').count());
              await page.locator('#planFocus').selectOption('Spoofer');
              console.log('SPOOFER FILTER:',await page.locator('#planSummary').innerText());
              if(await page.locator('.plan-row').count()<10)throw new Error('Spoofer recommendations missing');
              await page.locator('#planLang').selectOption('jp');
              console.log('SPOOFER JAPANESE:',await page.locator('#planSummary').innerText());
              if(await page.locator('.plan-row').count()<3)throw new Error('Japanese Spoofer recommendations missing');
              await page.locator('#planFocus').selectOption('Colorbot');
              console.log('COLORBOT JAPANESE:',await page.locator('#planSummary').innerText());
              if(await page.locator('.plan-row').count()<3)throw new Error('Japanese Colorbot recommendations missing');
              await page.locator('#planFocus').selectOption('all');
              await page.locator('#planLang').selectOption('all');
              await page.locator('#planMore').click();
              console.log('EXPANDED TARGET ROWS:',await page.locator('.plan-row').count());
              if(await page.locator('.plan-row').count()<45)throw new Error('Load more failed');
              await page.waitForFunction(()=>!document.querySelector('#liveFetch').disabled,{timeout:35000});
              await page.waitForFunction(()=>/✅|❌/.test(document.querySelector('#liveMessage')?.textContent||''),{timeout:55000});
              console.log('LIVE VIDEO STATUS:',await page.locator('#liveMessage').innerText());
              console.log('COMPETITOR COUNT:',await page.locator('#statVideos').innerText());
              await page.locator('#liveRegion').selectOption('US');
              await page.locator('#liveQuery').fill('valorant cheat');
              await page.locator('#liveFetch').click();
              await page.waitForFunction(()=>!document.querySelector('#liveFetch').disabled,{timeout:45000});
              await page.locator('#liveSuggest').click();
              await page.waitForFunction(()=>/✅|❌/.test(document.querySelector('#liveMessage')?.textContent||'')&&!document.querySelector('#liveSuggest').disabled,{timeout:55000});
              console.log('LIVE SUGGEST STATUS:',await page.locator('#liveMessage').innerText());
              console.log('SUGGEST CANDIDATE COUNT:',await page.locator('#statCandidates').innerText());
              console.log('PAGE ERRORS:',JSON.stringify(errors));
              const mobile=await browser.newPage({viewport:{width:390,height:844}});
              mobile.on('pageerror',e=>errors.push('mobile: '+e.message));
              await mobile.goto('https://nebula-cord-u83m9.ship.place/',{waitUntil:'domcontentloaded',timeout:30000});
              await mobile.waitForFunction(()=>Number(document.querySelector('#planTotal')?.textContent||0)>=230,{timeout:10000});
              console.log('MOBILE TARGETS:',await mobile.locator('.plan-row').count());
              console.log('MOBILE OVERFLOW:',await mobile.evaluate(()=>document.body.scrollWidth-window.innerWidth));
              await mobile.close();
              if(errors.length)process.exitCode=1;
              if(Number((await page.locator('#statVideos').innerText()).replace(/\D/g,''))<1)process.exitCode=1;
              if(Number((await page.locator('#statCandidates').innerText()).replace(/\D/g,''))<1)process.exitCode=1;
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
