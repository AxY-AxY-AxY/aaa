name: Verify live RankLab end to end
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-ranklab-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Browser and API smoke test
        run: |
          set -e
          which google-chrome || which chromium || true
          npm install --no-save playwright-core@1.58.0
          node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1280,height:900}});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.goto('https://volcano-hen-sihah.ship.place/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>/✅|❌/.test(document.querySelector('#liveMessage')?.textContent||''),{timeout:55000});
              console.log('LIVE VIDEO STATUS:',await page.locator('#liveMessage').innerText());
              console.log('COMPETITOR COUNT:',await page.locator('#statVideos').innerText());
              await page.locator('#liveSuggest').click();
              await page.waitForFunction(()=>/✅|❌/.test(document.querySelector('#liveMessage')?.textContent||'')&&!document.querySelector('#liveSuggest').disabled,{timeout:55000});
              console.log('LIVE SUGGEST STATUS:',await page.locator('#liveMessage').innerText());
              console.log('SUGGEST CANDIDATE COUNT:',await page.locator('#statCandidates').innerText());
              console.log('PAGE ERRORS:',JSON.stringify(errors));
              if(errors.length)process.exitCode=1;
              if(Number((await page.locator('#statVideos').innerText()).replace(/\D/g,''))<1)process.exitCode=1;
              if(Number((await page.locator('#statCandidates').innerText()).replace(/\D/g,''))<1)process.exitCode=1;
            }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
