name: Initialize RankLab keyword-only feed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/init-ranklab-seo-feed.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate ONLY keyword data
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ranklab/build_keyword_feed.py
          python3 ranklab/xday_seo_bridge.py --input-json ranklab/seo-feed.json --market JP --product VALORANT --limit 5 > /tmp/ranklab-keywords.json
          python3 - <<'PY'
          import json
          feed=json.load(open('ranklab/seo-feed.json',encoding='utf-8'))
          words=json.load(open('/tmp/ranklab-keywords.json',encoding='utf-8'))
          assert feed['schema']=='xday.ranklab.keyword-feed.v1'
          assert feed['mode']=='keywords_only'
          assert all(set(r.keys()).issuperset({'keyword','market','product'}) for r in feed['keywords'])
          assert all('proposed_title' not in r and 'intent' not in r for r in feed['keywords'])
          assert all(isinstance(x,str) for x in words)
          print('SEO_KEYWORDS_VALID',len(feed['keywords']),'VERIFIED',feed['counts']['verified'])
          print('JP_VALORANT_VALID',json.dumps(words,ensure_ascii=False))
          PY
      - name: Publish keyword feed without changing posting queue
        shell: bash
        run: |
          set -euo pipefail
          cp ranklab/seo-feed.json /tmp/ranklab-seo-feed.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ranklab-seo-feed.json ranklab/seo-feed.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ranklab/seo-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Switch RankLab output to keyword-only SEO data"
            git push origin HEAD:main
          fi
