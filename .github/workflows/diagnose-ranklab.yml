name: Diagnose RankLab cross-origin search
on:
  push:
    paths: ['.github/workflows/diagnose-ranklab.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
    - name: Test API CORS from hosted site
      run: |
        npm install --no-save playwright-core@1.58.0
        node <<'JS'
        const { chromium }=require('playwright-core');
        (async()=>{
          const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          for (const url of ['https://nebula-cord-u83m9.ship.place/','https://volcano-hen-sihah.ship.place/']){
            const p=await b.newPage({viewport:{width:1024,height:768}});
            const failures=[], logs=[];
            p.on('requestfailed',r=>failures.push({url:r.url().slice(0,200),why:r.failure()?.errorText}));
            p.on('console',m=>{if(m.type()==='error')logs.push(m.text().slice(0,300))});
            const resp=await p.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
            console.log('PAGE',url,resp.status(),'CSP',JSON.stringify(resp.headers()['content-security-policy']??'none'));
            await p.waitForTimeout(4000);
            console.log('API FAILURES',JSON.stringify(failures.slice(0,15)));
            console.log('CONSOLE ERRORS',JSON.stringify(logs.slice(0,15)));
            const target='https://yt.chocolatemoo53.com/api/v1/search?q=valorant%20cheat&type=video&region=US';
            const probe=await p.evaluate(async target=>{
              try{
                const res=await fetch(target,{mode:'cors'});const tx=await res.text();
                return {ok:res.ok,status:res.status,chars:tx.length,head:tx.slice(0,50)};
              }catch(e){return {error:String(e),stack:e.stack?.slice(0,400)}}
            },target);
            console.log('BROWSER FETCH',JSON.stringify(probe));
            await p.close();
          }
          await b.close();
        })().catch(e=>{console.error(e);process.exitCode=1});
        JS
